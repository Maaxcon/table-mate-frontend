name: Frontend CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: table-mate-frontend

    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          path: table-mate-frontend

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: table-mate-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Smoke test
        run: npm run smoke

  api-drift-gate:
    name: Verify API Type Alignment
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: table-mate-frontend

    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          path: table-mate-frontend
          # The PR head, not the merge commit checkout defaults to on
          # pull_request. The backend below is checked out as its own branch,
          # unmerged, so pairing a dev-merged frontend with it reports every
          # endpoint dev has gained since the branch point as drift — types the
          # backend branch has simply never seen. Compare the two branches as
          # they are; the test job still builds the merged result.
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      # Check a cross-repo feature against its matching backend branch. Feature
      # branches use -fe- and -be- names respectively; retain the same-name
      # lookup for branches that do not follow that convention.
      - name: Pick the backend ref to check against
        id: backend-ref
        # Runs from the workspace root, not the checked-out frontend: checkout
        # writes a repo-local http.<github>.extraheader holding *this* repo's
        # token, and that header wins over credentials in the URL — so asking
        # about the backend from inside table-mate-frontend authenticates with
        # the wrong token, fails, and silently falls back to dev every time.
        working-directory: ${{ github.workspace }}
        env:
          TOKEN: ${{ secrets.DEPENDENCY_ACCESS_TOKEN }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          REMOTE="https://x-access-token:${TOKEN}@github.com/unibrix/table-mate-backend.git"
          BACKEND_BRANCH="${BRANCH/-fe-/-be-}"
          for REF in "$BRANCH" "$BACKEND_BRANCH"; do
            if git ls-remote --exit-code --heads "$REMOTE" "$REF" >/dev/null 2>&1; then
              echo "ref=$REF" >> "$GITHUB_OUTPUT"
              echo "Checking against backend branch '$REF'."
              exit 0
            fi
          done
          echo "ref=dev" >> "$GITHUB_OUTPUT"
          echo "No matching backend branch; checking against 'dev'."

      - name: Checkout backend schema source
        uses: actions/checkout@v4
        with:
          repository: unibrix/table-mate-backend
          path: table-mate-backend
          token: ${{ secrets.DEPENDENCY_ACCESS_TOKEN }}
          ref: ${{ steps.backend-ref.outputs.ref }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: table-mate-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate typed API
        run: npm run generate:api

      - name: Check generated API type drift
        run: git diff --exit-code -- src/types/api

  build-and-push:
    name: Build and Push Docker Images
    needs: [test, api-drift-gate]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}'

      - name: Configure Docker for GAR
        run: gcloud auth configure-docker europe-docker.pkg.dev --quiet

      - name: Build and Push Frontend
        run: |
          IMAGE=europe-docker.pkg.dev/auth-server-381211/table-mate/frontend/develop

          docker build -t $IMAGE:latest -t $IMAGE:${{ github.sha }} -f Dockerfile .
          
          docker push $IMAGE --all-tags
