name: Frontend CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: table-mate-frontend

    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          path: table-mate-frontend

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: table-mate-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Smoke test
        run: npm run smoke

  api-drift-gate:
    name: Verify API Type Alignment
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: table-mate-frontend

    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          path: table-mate-frontend

      # A cross-repo feature lands under one branch name in both repos, so
      # check against the matching backend branch when there is one. Comparing
      # a feature PR against dev would fail on every endpoint its backend PR
      # adds — which is why this job used to be skipped on PRs entirely, and so
      # never caught the drift it exists to catch.
      - name: Pick the backend ref to check against
        id: backend-ref
        env:
          TOKEN: ${{ secrets.DEPENDENCY_ACCESS_TOKEN }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          REMOTE="https://x-access-token:${TOKEN}@github.com/unibrix/table-mate-backend.git"
          if git ls-remote --exit-code --heads "$REMOTE" "$BRANCH" >/dev/null 2>&1; then
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
            echo "Checking against backend branch '$BRANCH'."
          else
            echo "ref=dev" >> "$GITHUB_OUTPUT"
            echo "No backend branch '$BRANCH'; checking against 'dev'."
            echo "If this PR pairs with a backend PR, give both branches the same name."
          fi

      - name: Checkout backend schema source
        uses: actions/checkout@v4
        with:
          repository: unibrix/table-mate-backend
          path: table-mate-backend
          token: ${{ secrets.DEPENDENCY_ACCESS_TOKEN }}
          ref: ${{ steps.backend-ref.outputs.ref }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: table-mate-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate typed API
        run: npm run generate:api

      - name: Check generated API type drift
        run: git diff --exit-code -- src/types/api

  build-and-push:
    name: Build and Push Docker Images
    needs: [test, api-drift-gate]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}'

      - name: Configure Docker for GAR
        run: gcloud auth configure-docker europe-docker.pkg.dev --quiet

      - name: Build and Push Frontend
        run: |
          IMAGE=europe-docker.pkg.dev/auth-server-381211/table-mate/frontend/develop

          docker build -t $IMAGE:latest -t $IMAGE:${{ github.sha }} -f Dockerfile .
          
          docker push $IMAGE --all-tags
