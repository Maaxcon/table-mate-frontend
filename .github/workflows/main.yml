name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: table-mate-frontend

    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          path: table-mate-frontend

      - name: Checkout backend schema source
        uses: actions/checkout@v4
        with:
          repository: unibrix/table-mate-backend
          path: table-mate-backend

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: table-mate-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate typed API
        run: npm run generate:api

      - name: Lint
        run: npm run lint

      - name: Smoke test
        run: npm run smoke
