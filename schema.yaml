        if the booking has none.
      summary: View this reservation's pre-order
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          pattern: ^[0-9a-fA-F-]{36}$
        required: true
      tags:
      - Reservations
      security:
      - jwtAuth: []
      - jwt_Auth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreorderDetail'
          description: ''
        '204':
          description: No paid pre-order for this reservation.
    delete:
      operationId: reservations_reservations_preorder_destroy
      description: Cancels every paid round (simulated refund) — only while the kitchen
        hasn't started any of them yet.
      summary: Cancel this reservation's pre-order
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          pattern: ^[0-9a-fA-F-]{36}$
        required: true
      tags:
      - Reservations
      security:
      - jwtAuth: []
      - jwt_Auth: []
      responses:
        '204':
          description: Every round was cancelled.
        '404':
          description: No pre-order to cancel.
        '403':
          description: Only the booking's owner may cancel.
        '409':
          description: The kitchen has already started a round (code preorder_not_allowed).
  /api/reservations/reservations/{public_id}/preorder/items/{item_id}/:
    delete:
      operationId: reservations_reservations_preorder_items_destroy
      description: Voids a single paid dish and refunds it — only while the kitchen
        hasn't started the round. Removing the last dish cancels the whole round,
        which answers 204. Otherwise returns the updated check.
      summary: Remove one dish from this reservation's pre-order
      parameters:
      - in: path
        name: item_id
        schema:
          type: string
        description: Public id of the dish, as returned in the pre-order's items.
        required: true
      - in: path
        name: public_id
        schema:
          type: string
          pattern: ^[0-9a-fA-F-]{36}$
        required: true
      tags:
      - Reservations
      security:
      - jwtAuth: []
      - jwt_Auth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreorderDetail'
          description: ''
        '204':
          description: That was the last dish; the pre-order is gone.
        '404':
          description: No such dish on this booking's pre-order.
        '403':
          description: Only the booking's owner may change it.
        '409':
          description: The kitchen has already started the round (code preorder_not_allowed).
  /api/reservations/reservations/availability/:
    get:
      operationId: reservations_reservations_availability_retrieve
      description: 'Given restaurant + date + time (+ optional duration in minutes,
        default 120), returns each active table''s availability for that slot as {
        availability: { ''<table_public_id>'': true|false } }. A table is free when
        the slot is within working hours, in the future, and has no overlapping pending/active
        reservation. Powers the time-aware floor plan.'
      summary: Per-table availability for one slot
      parameters:
      - in: query
        name: date
        schema:
          type: string
        description: YYYY-MM-DD.
        required: true
      - in: query
        name: duration
        schema:
          type: integer
        description: Minutes, default 120, clamped to a minimum of 30.
      - in: query
        name: restaurant
        schema:
          type: string
        description: Restaurant public ID.
        required: true
      - in: query
        name: time
        schema:
          type: string
        description: HH:MM, restaurant-local.
        required: true
      tags:
      - Reservations
      security:
      - jwt_Auth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableAvailabilityResponse'
          description: ''
  /api/reservations/reservations/available-slots/:
    get:
      operationId: reservations_reservations_available_slots_retrieve
      description: Returns available 30-min time slots for a table. If date is provided,
        returns slots for that date only. Otherwise returns slots for the next 14
        days.
      summary: Available time slots for a table
      parameters:
      - in: query
        name: date
        schema:
          type: string
        description: YYYY-MM-DD. Omit to get the next 14 days.
      - in: query
        name: exclude
        schema:
          type: array
          items:
            type: string
        description: Reservation public ID(s) to exclude, e.g. the booking currently
          being rescheduled.
      - in: query
        name: table
        schema:
          type: string
        description: Table public ID.
        required: true
      tags:
      - Reservations
      security:
      - jwt_Auth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                description: date (YYYY-MM-DD) -> list of bookable HH:MM slot start
                  times
                additionalProperties:
                  type: array
                  items:
                    type: string
          description: ''
