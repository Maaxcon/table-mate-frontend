components:
  schemas:
    ActionEnum:
      enum:
      - set_available
      - set_category
      - delete
      type: string
      description: |-
        * `set_available` - set_available
        * `set_category` - set_category
        * `delete` - delete
    AddCartItem:
      type: object
      properties:
        menu_item:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
        comment:
          type: string
          nullable: true
        guest_slot:
          type: integer
          minimum: 1
          nullable: true
      required:
      - menu_item
      - quantity
    AdminMenu:
      type: object
      description: Writable menu serializer for the admin panel.
      properties:
        public_id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - name
      - public_id
      - updated_at
    AdminMenuCategory:
      type: object
      description: |-
        Writable category serializer. The menu is referenced by its public id and
        must belong to the admin's restaurant (validated in the view's queryset).
      properties:
        public_id:
          type: string
          format: uuid
          readOnly: true
        menu:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 255
        sort_order:
          type: integer
          maximum: 2147483647
          minimum: 0
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - menu
      - name
      - public_id
      - updated_at
    AdminMenuItem:
      type: object
      description: |-
        Writable menu item serializer for the admin panel. Menu and category are
        referenced by public id and limited to the admin's restaurant in the view.
      properties:
        public_id:
          type: string
          format: uuid
          readOnly: true
        menu:
          type: string
          format: uuid
        category:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
        ingredients:
          type: array
          items:
            type: string
        allergens:
          type: array
          items:
            type: string
        weight_grams:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
        image:
          type: string
          format: uri
          nullable: true
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,4})?$
        is_available:
          type: boolean
        sort_order:
          type: integer
          maximum: 2147483647
          minimum: 0
        likes_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - likes_count
      - menu
      - name
      - price
      - public_id
      - updated_at
    AdminOverview:
      type: object
      description: Counts for the admin dashboard, scoped to the admin's restaurant.
      properties:
        menus_total:
          type: integer
        menus_active:
          type: integer
        dishes_total:
          type: integer
        dishes_hidden:
          type: integer
        categories_total:
          type: integer
        staff_total:
          type: integer
        staff_active:
          type: integer
      required:
      - categories_total
      - dishes_hidden
      - dishes_total
      - menus_active
      - menus_total
      - staff_active
      - staff_total
    BookingSettings:
      type: object
      properties:
        currency:
          type: string
          readOnly: true
        timezone:
          type: string
          readOnly: true
        working_hours:
          readOnly: true
      required:
      - currency
      - timezone
      - working_hours
    BulkItemAction:
      type: object
      description: |-
        A bulk operation over several menu items, selected by public id.

        - ``set_available`` needs ``is_available``
        - ``set_category`` needs ``category`` (may be null to clear it)
        - ``delete`` needs nothing else
      properties:
        ids:
          type: array
          items:
            type: string
            format: uuid
        action:
          $ref: '#/components/schemas/ActionEnum'
        is_available:
          type: boolean
        category:
          type: string
          format: uuid
          nullable: true
      required:
      - action
      - ids
    CartItem:
      type: object
      properties:
        public_id:
          type: string
          format: uuid
          readOnly: true
        menu_item:
          type: string
          format: uuid
          readOnly: true
        quantity:
          type: integer
          maximum: 2147483647
          minimum: 0
        comment:
          type: string
          nullable: true
        added_by:
          type: string
          format: uuid
          readOnly: true
        guest_slot:
          type: integer
          readOnly: true
          nullable: true
        is_mine:
          type: boolean
          readOnly: true
        is_paid:
          type: boolean
          readOnly: true
        display_name:
          type: string
          nullable: true
          readOnly: true
        cart_session:
          type: string
          format: uuid
          readOnly: true
        restaurant:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - added_by
      - cart_session
      - created_at
      - display_name
      - guest_slot
      - is_mine
      - is_paid
      - menu_item
      - public_id
      - quantity
      - restaurant
      - updated_at
    CartSession:
      type: object
      properties:
        public_id:
          type: string
          format: uuid
          readOnly: true
        restaurant:
          type: string
          format: uuid
          readOnly: true
        reservation:
          type: string
          format: uuid
        status:
          allOf:
          - $ref: '#/components/schemas/CartSessionStatusEnum'
          readOnly: true
        created_by:
          type: string
          format: uuid
          readOnly: true
        participants:
          type: array
          items:
            type: string
            format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - created_by
      - participants
      - public_id
      - reservation
      - restaurant
      - status
      - updated_at
    CartSessionStatusEnum:
      enum:
      - active
      - closed
      type: string
      description: |-
        * `active` - Active
        * `closed` - Closed
    CheckoutResponse:
      type: object
