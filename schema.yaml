openapi: 3.0.3
info:
  title: TableMate Platform API
  version: 1.0.0
  description: Real-time multi-tenant restaurant operational ecosystem backend.
paths:
  /api/auth/customer/context/:
    post:
      operationId: auth_customer_context_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerContext'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomerContext'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomerContext'
        required: true
      security:
      - jwtAuth: []
      - jwt_Auth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleContextResponse'
          description: ''
        '403':
          description: User is not a participant in this reservation.
  /api/auth/google/:
    post:
      operationId: auth_google_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleAuth'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GoogleAuth'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GoogleAuth'
        required: true
      security:
      - jwtAuth: []
      - jwt_Auth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleAuthResponse'
          description: ''
        '400':
          description: Google authentication failed.
  /api/auth/google/context/:
    post:
      operationId: auth_google_context_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleContext'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GoogleContext'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GoogleContext'
      security:
      - jwtAuth: []
      - jwt_Auth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleContextResponse'
          description: ''
        '400':
          description: User is not a member of this restaurant.
        '404':
          description: Restaurant not found.
  /api/auth/guest-init/:
    post:
      operationId: auth_guest_init_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuestInit'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GuestInit'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GuestInit'
      security:
      - jwt_Auth: []
      - {}
      responses:
        '200':
          description: Guest JWT issued.
        '400':
          description: Invalid request.
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      tags:
      - auth
      security:
      - jwtAuth: []
      - jwt_Auth: []
      - {}
      responses:
        '200':
          description: Refresh token cookie cleared.
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      tags:
      - auth
      security:
      - jwtAuth: []
      - jwt_Auth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: auth_me_partial_update
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMeUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMeUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMeUpdate'
      security:
      - jwtAuth: []
      - jwt_Auth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeUpdate'
          description: ''
  /api/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      security:
      - jwt_Auth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/auth/token/:
    post:
      operationId: auth_token_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPair'
        required: true
      security:
      - jwt_Auth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomTokenObtainPair'
          description: ''
  /api/editor/layouts/:
    get:
      operationId: editor_layouts_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: published_at
        schema:
          type: string
          format: date-time
      - in: query
        name: published_by
        schema:
          type: integer
      - in: query
        name: version
        schema:
          type: integer
      tags:
      - Editor
      security:
      - jwtAuth: []
      - jwt_Auth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLayoutList'
          description: ''
  /api/editor/layouts/{public_id}/:
    get:
      operationId: editor_layouts_retrieve
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          pattern: ^[0-9a-fA-F-]{36}$
        required: true
      tags:
      - Editor
      security:
      - jwtAuth: []
      - jwt_Auth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Layout'
          description: ''
  /api/editor/layouts/draft/:
    get:
      operationId: editor_layouts_draft_retrieve
      description: 'GET: load the current admin''s draft (or latest published if no
        draft). PUT: save a draft (validates same schema as publish, no Table/Zone
        side effects). DELETE: discard the current draft.'
      summary: Floor plan draft
      tags:
      - Editor
      security:
      - jwtAuth: []
      - jwt_Auth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftLayout'
          description: ''
        '204':
          description: No response body
    put:
      operationId: editor_layouts_draft_update
      description: 'GET: load the current admin''s draft (or latest published if no
        draft). PUT: save a draft (validates same schema as publish, no Table/Zone
        side effects). DELETE: discard the current draft.'
      summary: Floor plan draft
      tags:
      - Editor
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishLayout'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PublishLayout'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PublishLayout'
        required: true
      security:
      - jwtAuth: []
      - jwt_Auth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftLayout'
          description: ''
        '204':
          description: No response body
    delete:
      operationId: editor_layouts_draft_destroy
      description: 'GET: load the current admin''s draft (or latest published if no
        draft). PUT: save a draft (validates same schema as publish, no Table/Zone
        side effects). DELETE: discard the current draft.'
      summary: Floor plan draft
      tags:
      - Editor
      security:
      - jwtAuth: []
      - jwt_Auth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftLayout'
          description: ''
        '204':
          description: No response body
  /api/editor/layouts/entity-translations/:
    get:
      operationId: editor_layouts_entity_translations_list
      description: Returns label translations for thresholds/portals in the latest
        published layout. Table labels are managed via TableTranslation and not included
        here.
      summary: List floor plan entity translations
      parameters:
      - in: query
        name: language
        schema:
          type: string
        description: Filter translations to a single language code.
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: published_at
        schema:
          type: string
          format: date-time
      - in: query
        name: published_by
        schema:
          type: integer
      - in: query
        name: version
        schema:
          type: integer
      tags:
      - Editor
      security:
      - jwtAuth: []
      - jwt_Auth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLayoutEntityTranslationList'
          description: ''
    post:
      operationId: editor_layouts_entity_translations_create
      description: Stores a label translation for a threshold/portal against the latest
        published layout version.
      summary: Create a floor plan entity translation
      tags:
      - Editor
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LayoutEntityTranslation'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LayoutEntityTranslation'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LayoutEntityTranslation'
        required: true
      security:
      - jwtAuth: []
      - jwt_Auth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LayoutEntityTranslation'
          description: ''
  /api/editor/layouts/entity-translations/{entity_id}/{lang}/:
    put:
      operationId: editor_layouts_entity_translations_update
      description: Updates a label translation for a threshold/portal. Supports optimistic
        locking via ``current``/``updated`` payloads; a stale ``current`` returns
        409 CONFLICT.
      summary: Update a floor plan entity translation
      parameters:
      - in: path
        name: entity_id
        schema:
          type: string
        required: true
      - in: path
        name: lang
        schema:
          type: string
        required: true
      tags:
      - Editor
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LayoutEntityTranslation'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LayoutEntityTranslation'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LayoutEntityTranslation'
        required: true
      security:
      - jwtAuth: []
      - jwt_Auth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LayoutEntityTranslation'
          description: ''
    delete:
      operationId: editor_layouts_entity_translations_destroy
      summary: Delete a floor plan entity translation
      parameters:
      - in: path
        name: entity_id
        schema:
          type: string
        required: true
      - in: path
        name: lang
        schema:
          type: string
        required: true
      tags:
      - Editor
      security:
      - jwtAuth: []
      - jwt_Auth: []
      responses:
        '204':
          description: No response body
  /api/editor/layouts/latest/:
    get:
      operationId: editor_layouts_latest_retrieve
      description: Returns the layout_json from the most recent LayoutVersion for
        the admin editor.
      summary: Latest published layout JSON
      tags:
      - Editor
      security:
      - jwtAuth: []
      - jwt_Auth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/editor/layouts/publish/:
    post:
      operationId: editor_layouts_publish_create
      tags:
      - Editor
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishLayout'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PublishLayout'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PublishLayout'
        required: true
      security:
      - jwtAuth: []
      - jwt_Auth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LayoutVersion'
          description: ''
  /api/editor/tables/:
    get:
      operationId: editor_tables_list
      parameters:
      - in: query
        name: active
        schema:
          type: boolean
      - in: query
        name: capacity
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Editor
      security:
      - jwtAuth: []
      - jwt_Auth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEditorTableList'
          description: ''
  /api/editor/tables/{public_id}/:
    get:
      operationId: editor_tables_retrieve
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          pattern: ^[0-9a-fA-F-]{36}$
        required: true
      tags:
      - Editor
      security:
      - jwtAuth: []
      - jwt_Auth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditorTable'
          description: ''
    patch:
      operationId: editor_tables_partial_update
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          pattern: ^[0-9a-fA-F-]{36}$
        required: true
      tags:
      - Editor
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedEditorTable'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedEditorTable'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedEditorTable'
      security:
      - jwtAuth: []
      - jwt_Auth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditorTable'
          description: ''
  /api/editor/tables/available/:
    get:
      operationId: editor_tables_available_list
      parameters:
      - in: query
        name: end_at
        schema:
          type: string
        description: ISO 8601 datetime
        required: true
      - in: query
        name: exclude
        schema:
          type: string
        description: Reservation public ID to exclude when checking an existing booking.
      - in: query
        name: guest_count
        schema:
          type: integer
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: restaurant
        schema:
          type: string
        description: Restaurant public ID for unauthenticated access
      - in: query
        name: start_at
        schema:
          type: string
        description: ISO 8601 datetime
        required: true
      tags:
      - Editor
      security:
      - jwt_Auth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEditorTableList'
          description: ''
  /api/menu/admin/allergens/:
    get:
      operationId: menu_admin_allergens_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Menu Admin
      security:
      - jwtAuth: []
      - jwt_Auth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminAllergenList'
          description: ''
    post:
      operationId: menu_admin_allergens_create
      tags:
      - Menu Admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminAllergen'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminAllergen'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminAllergen'
        required: true
      security:
      - jwtAuth: []
      - jwt_Auth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAllergen'
          description: ''
  /api/menu/admin/allergens/{public_id}/:
    get:
      operationId: menu_admin_allergens_retrieve
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          pattern: ^[0-9a-fA-F-]{36}$
        required: true
      tags:
      - Menu Admin
      security:
      - jwtAuth: []
      - jwt_Auth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAllergen'
          description: ''
    put:
      operationId: menu_admin_allergens_update
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          pattern: ^[0-9a-fA-F-]{36}$
        required: true
      tags:
      - Menu Admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminAllergen'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminAllergen'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminAllergen'
        required: true
      security:
      - jwtAuth: []
      - jwt_Auth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAllergen'
          description: ''
    patch:
      operationId: menu_admin_allergens_partial_update
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          pattern: ^[0-9a-fA-F-]{36}$
        required: true
      tags:
      - Menu Admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAdminAllergen'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAdminAllergen'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAdminAllergen'
      security:
      - jwtAuth: []
      - jwt_Auth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAllergen'
          description: ''
    delete:
      operationId: menu_admin_allergens_destroy
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          pattern: ^[0-9a-fA-F-]{36}$
        required: true
      tags:
      - Menu Admin
      security:
      - jwtAuth: []
      - jwt_Auth: []
      responses:
        '204':
          description: No response body
  /api/menu/admin/allergens/{public_id}/translations/:
    get:
      operationId: menu_admin_allergens_translations_retrieve
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          pattern: ^[0-9a-fA-F-]{36}$
        required: true
      tags:
      - Menu Admin
      security:
      - jwtAuth: []
      - jwt_Auth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAllergen'
          description: ''
    post:
      operationId: menu_admin_allergens_translations_create
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          pattern: ^[0-9a-fA-F-]{36}$
        required: true
      tags:
      - Menu Admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminAllergen'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminAllergen'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminAllergen'
        required: true
      security:
      - jwtAuth: []
      - jwt_Auth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAllergen'
          description: ''
  /api/menu/admin/allergens/{public_id}/translations/{lang}/:
    put:
      operationId: menu_admin_allergens_translations_update
      parameters:
      - in: path
        name: lang
        schema:
          type: string
        required: true
      - in: path
        name: public_id
        schema:
          type: string
          pattern: ^[0-9a-fA-F-]{36}$
        required: true
      tags:
      - Menu Admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminAllergen'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminAllergen'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminAllergen'
        required: true
      security:
      - jwtAuth: []
      - jwt_Auth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAllergen'
          description: ''
    delete:
      operationId: menu_admin_allergens_translations_destroy
      parameters:
      - in: path
        name: lang
        schema:
          type: string
        required: true
      - in: path
        name: public_id
        schema:
          type: string
          pattern: ^[0-9a-fA-F-]{36}$
        required: true
      tags:
      - Menu Admin
      security:
      - jwtAuth: []
      - jwt_Auth: []
      responses:
        '204':
          description: No response body
  /api/menu/admin/categories/:
    get:
      operationId: menu_admin_categories_list
      parameters:
      - in: query
        name: menu
        schema:
          type: string
          format: uuid
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Menu Admin
      security:
      - jwtAuth: []
      - jwt_Auth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminMenuCategoryList'
