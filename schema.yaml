  /api/restaurants/tables/verify-scan/:
    post:
      operationId: restaurants_tables_verify_scan_create
      description: Checks for an imminent PENDING reservation for the scanned table.
        Requires authentication. If found and owned by the caller, flips the reservation
        to ACTIVE.
      summary: Verify a table QR scan
      tags:
      - Restaurants
      requestBody:
        content:
          application/json:
