        required: true
      security:
      - jwtAuth: []
      - jwt_Auth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminMenu'
          description: ''
    patch:
      operationId: menu_admin_menus_partial_update
