      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAdminMenuCategory'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAdminMenuCategory'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAdminMenuCategory'
      security:
      - jwtAuth: []
      - jwt_Auth: []
      responses:
